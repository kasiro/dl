[project]
name = "dl"
version = "0.1.0"
description = "DL language compiler"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "lark>=1.3.1",
    "pygls>=2.1.1",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "toml>=0.10.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
dl = "dl.cli:main"
dl-lsp = "dl_lsp.server:main"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
